<!doctype html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Parent Perspective VR</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial}
#start{position:fixed;z-index:5;top:3%;left:4%;width:92%;max-width:520px;background:rgba(250,248,244,.96);color:#263b3a;padding:18px;box-sizing:border-box;border:1px solid rgba(120,147,142,.35);border-radius:18px;text-align:center;box-shadow:0 14px 38px rgba(28,48,48,.22)}
button,select{font-size:16px;padding:10px;margin:5px;border-radius:8px}
button{background:#557f7a;color:white;border:0;width:85%;font-weight:600;box-shadow:0 4px 12px rgba(30,60,58,.18)}
#note{font-size:12px;color:#555}
</style></head><body>
<div id="start"><h2>Μπες στη θέση του παιδιού μου</h2>
<p>Επίλεξε ηλικιακή ομάδα και ξεκίνα.</p>
<select id="age"><option value="kindergarten">Νηπιαγωγείο</option><option value="primary" selected>Δημοτικό</option><option value="adolescent">Εφηβεία</option></select><br>
<button id="start360">Έναρξη 360°</button><br><button id="startvr">Είσοδος σε VR</button>
<p id="note">Για Cardboard δοκίμασε Chrome σε Android και HTTPS. Οι χαρακτήρες είναι προσωρινά απλά 3D σχήματα.</p></div>


<div id="canvas-assets" style="display:none">
<canvas id="cv-title" width="1200" height="180"></canvas>
<canvas id="cv-message" width="1200" height="420"></canvas>
<canvas id="cv-l0" width="1200" height="220"></canvas>
<canvas id="cv-l1" width="1200" height="220"></canvas>
<canvas id="cv-l2" width="1200" height="220"></canvas>
</div>
<a-scene vr-mode-ui="enabled:true" background="color:#dce8e7">

<!-- skirting and warm rug -->
<a-box position="0 .08 -4.43" width="9.8" height=".16" depth=".08" color="#b99c80"></a-box>
<a-plane position="0 .012 -2.15" rotation="-90 0 0" width="4.4" height="2.8" material="color:#b8c9c3;roughness:1"></a-plane>
<a-cylinder position="0 .025 -2.15" rotation="90 0 0" radius=".08" height=".01" color="#d9e2dc"></a-cylinder>
<!-- large soft daylight window on back wall -->
<a-box position="0 2.65 -4.43" width="2.5" height="1.65" depth=".08" color="#9b806b"></a-box>
<a-plane position="0 2.65 -4.375" width="2.32" height="1.47" material="color:#b9d9df;emissive:#789ba4;emissiveIntensity:.12;shader:standard"></a-plane>
<a-box position="0 2.65 -4.32" width=".055" height="1.5" depth=".035" color="#f4eee5"></a-box>
<a-box position="0 2.65 -4.32" width="2.35" height=".055" depth=".035" color="#f4eee5"></a-box>
<!-- curtains -->
<a-box position="-1.35 2.65 -4.30" width=".25" height="1.9" depth=".12" color="#c58e79"></a-box>
<a-box position="1.35 2.65 -4.30" width=".25" height="1.9" depth=".12" color="#c58e79"></a-box>
<!-- sofa and cushions -->
<a-box position="0 0.48 -3.35" width="3.0" height=".65" depth=".72" radius=".12" color="#78938e"></a-box>
<a-box position="0 .93 -3.62" width="3.0" height=".45" depth=".28" color="#6f8984"></a-box>
<a-box position="-1.28 .92 -3.28" width=".42" height=".72" depth=".78" color="#6f8984"></a-box>
<a-box position="1.28 .92 -3.28" width=".42" height=".72" depth=".78" color="#6f8984"></a-box>
<a-box position="-.85 .78 -2.98" width=".58" height=".42" depth=".12" rotation="0 0 -8" color="#d7b6a4"></a-box>
<a-box position=".78 .78 -2.98" width=".58" height=".42" depth=".12" rotation="0 0 8" color="#e4d5b8"></a-box>
<!-- side table and lamp -->
<a-cylinder position="-2.25 .38 -2.65" radius=".38" height=".08" color="#9b7658"></a-cylinder>
<a-cylinder position="-2.25 .2 -2.65" radius=".055" height=".36" color="#9b7658"></a-cylinder>
<a-cylinder position="-2.25 .82 -2.65" radius=".16" height=".34" color="#e7d8c4"></a-cylinder>
<a-cone position="-2.25 1.08 -2.65" radius-bottom=".27" radius-top=".12" height=".35" color="#e9cda4"></a-cone>
<!-- bookshelf on left wall -->
<a-box position="-4.55 1.55 -1.6" rotation="0 90 0" width="1.5" height="2.3" depth=".42" color="#a77d5d"></a-box>
<a-box position="-4.30 .85 -1.6" rotation="0 90 0" width="1.35" height=".07" depth=".36" color="#d2b18e"></a-box>
<a-box position="-4.30 1.5 -1.6" rotation="0 90 0" width="1.35" height=".07" depth=".36" color="#d2b18e"></a-box>
<a-box position="-4.30 2.15 -1.6" rotation="0 90 0" width="1.35" height=".07" depth=".36" color="#d2b18e"></a-box>
<a-box position="-4.45 1.12 -1.78" width=".12" height=".48" depth=".12" color="#d18a63"></a-box>
<a-box position="-4.35 1.12 -1.61" width=".12" height=".48" depth=".12" color="#e3c17e"></a-box>
<a-box position="-4.25 1.12 -1.45" width=".12" height=".48" depth=".12" color="#78938e"></a-box>
<!-- plant in right corner -->
<a-cylinder position="3.55 .35 -3.45" radius=".28" height=".55" color="#b87958"></a-cylinder>
<a-cylinder position="3.55 .95 -3.45" radius=".035" height=".9" color="#66866b"></a-cylinder>
<a-sphere position="3.25 1.05 -3.45" scale=".35 .58 .18" color="#789a78"></a-sphere>
<a-sphere position="3.83 1.15 -3.45" scale=".35 .58 .18" color="#86a884"></a-sphere>
<a-sphere position="3.55 1.35 -3.45" scale=".32 .58 .18" color="#6f9272"></a-sphere>
<!-- parent character -->
<a-entity position="-.82 0 -2.05">
  <a-cylinder position="0 1.03 0" radius=".29" height=".78" color="#6f91a2"></a-cylinder>
  <a-sphere position="0 1.58 0" radius=".235" color="#d9a27f"></a-sphere>
  <a-sphere position="0 1.68 -.16" scale="1.05 1 .42" radius=".23" color="#49372f"></a-sphere>
  <a-sphere position="-.09 1.59 -.205" scale=".06 .045 .025" color="#49372f"></a-sphere>
  <a-sphere position=".09 1.59 -.205" scale=".06 .045 .025" color="#49372f"></a-sphere>
  <a-cylinder position="-.13 .35 0" radius=".095" height=".65" color="#45566a"></a-cylinder>
  <a-cylinder position=".13 .35 0" radius=".095" height=".65" color="#45566a"></a-cylinder>
  <a-sphere position="-.34 1.0 0" scale=".12 .32 .12" rotation="0 0 -18" color="#d9a27f"></a-sphere>
  <a-sphere position=".34 1.0 0" scale=".12 .32 .12" rotation="0 0 18" color="#d9a27f"></a-sphere>
</a-entity>
<!-- child character -->
<a-entity position=".88 0 -1.45">
  <a-cylinder position="0 .72 0" radius=".235" height=".6" color="#d18b5e"></a-cylinder>
  <a-sphere position="0 1.16 0" radius=".205" color="#e0ad88"></a-sphere>
  <a-sphere position="0 1.24 -.14" scale="1.04 1 .42" radius=".205" color="#5a4031"></a-sphere>
  <a-sphere position="-.075 1.17 -.18" scale=".045 .035 .02" color="#49372f"></a-sphere>
  <a-sphere position=".075 1.17 -.18" scale=".045 .035 .02" color="#49372f"></a-sphere>
  <a-cylinder position="-.105 .23 0" radius=".075" height=".4" color="#536f8c"></a-cylinder>
  <a-cylinder position=".105 .23 0" radius=".075" height=".4" color="#536f8c"></a-cylinder>
  <a-sphere position="-.27 .7 0" scale=".09 .24 .09" rotation="0 0 -18" color="#e0ad88"></a-sphere>
  <a-sphere position=".27 .7 0" scale=".09 .24 .09" rotation="0 0 18" color="#e0ad88"></a-sphere>
</a-entity>
<a-entity light="type:ambient;intensity:.92"></a-entity>
<a-entity light="type:directional;intensity:.72" position="-2 5 3"></a-entity>
<a-entity light="type:point;intensity:.35;distance:8" position="0 3 -2"></a-entity>

<a-entity id="rig" position="0 1.15 .65"><a-camera wasd-controls-enabled="false" look-controls="enabled:true;mouseEnabled:true;touchEnabled:true">
<a-entity id="gazeCursor" cursor="fuse:true;fuseTimeout:1500"
 raycaster="objects:.gazeable;far:8" position="0 0 -1" geometry="primitive:ring;radiusInner:.008;radiusOuter:.014" material="color:white;shader:flat"></a-entity>
<a-entity id="mouseCursor" cursor="rayOrigin:mouse" raycaster="objects:.gazeable;far:8"></a-entity>
<a-entity position="0 .28 -1.6">
<a-plane width="1.95" height=".88" position="0 0 0" material="color:#172b38;opacity:.68;transparent:true;shader:flat"></a-plane>
<a-plane id="title" width="1.82" height=".24" position="0 .29 .025" material="shader:flat;transparent:true;color:#ffffff"></a-plane>
<a-plane id="message" width="1.82" height=".53" position="0 -.12 .025" material="shader:flat;transparent:true;color:#ffffff"></a-plane></a-entity>
<a-entity id="choices" position="0 -.78 -1.55">
<a-entity id="c0" class="gazeable" position="0 .30 0" geometry="primitive:plane;width:1.8;height:.29" material="color:#245b73;opacity:.78;transparent:true;shader:flat" gaze-choice="index:0"><a-plane id="l0" width="1.72" height=".28" position="0 0 .025" material="shader:flat;transparent:true;color:#ffffff"></a-plane></a-entity>
<a-entity id="c1" class="gazeable" position="0 -.05 0" geometry="primitive:plane;width:1.8;height:.29" material="color:#245b73;opacity:.78;transparent:true;shader:flat" gaze-choice="index:1"><a-plane id="l1" width="1.72" height=".28" position="0 0 .025" material="shader:flat;transparent:true;color:#ffffff"></a-plane></a-entity>
<a-entity id="c2" class="gazeable" position="0 -.40 0" geometry="primitive:plane;width:1.8;height:.29" material="color:#245b73;opacity:.78;transparent:true;shader:flat" gaze-choice="index:2"><a-plane id="l2" width="1.72" height=".28" position="0 0 .025" material="shader:flat;transparent:true;color:#ffffff"></a-plane></a-entity>
</a-entity></a-camera></a-entity></a-scene>

<script>
const opening={kindergarten:"Δεν θέλω να ξαναπάω στο σχολείο. Η κυρία μου φώναξε!",primary:"Δεν ξαναπάω σχολείο. Η κυρία μου μίλησε άσχημα.",adolescent:"Δεν πρόκειται να ξαναπάω στο σχολείο. Η καθηγήτρια με πρόσβαλε μπροστά σε όλους."};
const first=["Έλα τώρα, μην κάνεις έτσι. Πήγαινε να πλύνεις τα χέρια σου.","Μην ανησυχείς, θα μιλήσω εγώ στην κυρία σου.","Ακούω ότι στενοχωρήθηκες. Θέλεις να μου πεις τι έγινε;"];
const second=["Μην το σκέφτεσαι, δεν έγινε τίποτα.","Καταλαβαίνω ότι ένιωσες άσχημα μπροστά στους συμμαθητές σου.","Γιατί δεν απάντησες στην κυρία;"];
let age="primary",stage="intro",firstChoice=-1,secondChoice=-1,started=0,events=[];
const $=id=>document.getElementById(id);

const labelTextures = {};
function bindLabelTexture(planeId, canvasId) {
  const plane = document.getElementById(planeId);
  const canvas = document.getElementById(canvasId);
  if (!plane || !canvas || !plane.getObject3D("mesh")) return false;
  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;
  const material = plane.getObject3D("mesh").material;
  material.map = texture;
  material.transparent = true;
  material.color.set("#ffffff");
  material.needsUpdate = true;
  labelTextures[canvasId] = texture;
  return true;
}
function paint(canvasId, value, fontSize, maxLines=5) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `600 ${fontSize}px Arial, sans-serif`;
  const words = String(value || "").replace(/\n/g, " ").split(/\s+/);
  const lines = [];
  let line = "";
  const maxWidth = canvas.width * 0.94;
  for (const word of words) {
    const candidate = line ? line + " " + word : word;
    if (ctx.measureText(candidate).width > maxWidth && line) {
      lines.push(line); line = word;
    } else line = candidate;
  }
  if (line) lines.push(line);
  const visibleLines = lines.slice(0, maxLines);
  const lineHeight = fontSize * 1.25;
  const firstY = canvas.height / 2 - ((visibleLines.length - 1) * lineHeight) / 2;
  visibleLines.forEach((item, index) => ctx.fillText(item, canvas.width / 2, firstY + index * lineHeight));
  const texture = labelTextures[canvasId];
  if (texture) texture.needsUpdate = true;
}
function text(heading, message) {
  paint("cv-title", heading, 62, 1);
  paint("cv-message", message, 42, 5);
}
function buttons(arr, fn) {
  for (let i = 0; i < 3; i++) {
    const active = i < arr.length && !!arr[i];
    $("c" + i).setAttribute("visible", active);
    paint("cv-l" + i, arr[i] || "", 46, 2);
  }
  window.action = fn;
}

function log(event,value){events.push({event,value,age,elapsed:((performance.now()-started)/1000).toFixed(1)});}

function move(parent){$("rig").setAttribute("animation__pos","property:position;to:"+(parent?"-1 1.5 .45":"0 1.15 .65")+";dur:800");$("rig").setAttribute("animation__rot","property:rotation;to:"+(parent?"0 28 0":"0 0 0")+";dur:800");}
function intro(){stage="intro";text("Μπες στη θέση του παιδιού σου","Θα δεις μια δύσκολη στιγμή από δύο οπτικές γωνίες. Δεν υπάρχει βαθμολογία. Επίλεξε την απάντηση που θα σου ερχόταν αυθόρμητα.");buttons(["Έναρξη","",""],childView);}
function childView(){stage="child";move(false);text("Η οπτική του παιδιού",opening[age]+"\n\nΠώς μπορεί να αισθάνεται;");buttons(["Αλλαγή οπτικής γωνίας","",""],parentView);}
function parentView(){stage="parent";move(true);text("Η οπτική του γονέα","Το παιδί σου επιστρέφει αναστατωμένο και σου λέει:\n«"+opening[age]+"»\n\nΠώς θα απαντούσες αυθόρμητα;");buttons(first,chooseFirst);}
function reaction(i){if(i===0)return "Καλά, άστο. Δεν θέλω να σου πω.";if(i===1)return "Δεν θέλω να κάνεις εσύ κάτι. Θέλω απλώς να σου πω τι έγινε.";return age==="kindergarten"?"Μου είπε δυνατά ότι δεν άκουγα και όλα τα παιδιά με κοιτούσαν.":age==="adolescent"?"Η καθηγήτρια είπε μπροστά σε όλους ότι δεν προσπαθώ αρκετά και ένιωσα ότι με εξευτέλισε.":"Η κυρία μου είπε μπροστά σε όλους ότι δεν προσπαθώ αρκετά.";}
function chooseFirst(i){firstChoice=i;log("first_choice",first[i]);stage="reaction";text("Η αντίδραση του παιδιού",reaction(i));buttons(["Συνέχεια","",""],secondStep);}
function secondStep(){stage="second";text("Μια δεύτερη ευκαιρία","Το παιδί συνεχίζει:\n«"+reaction(firstChoice)+"»\n\nΠώς θα απαντούσες τώρα;");buttons(second,i=>{secondChoice=i;log("second_choice",second[i]);reflection();});}
function reflection(){stage="reflection";let f=secondChoice===1?"Η απάντηση αναγνωρίζει το συναίσθημα και αφήνει χώρο στο παιδί να εκφραστεί.":secondChoice===0?"Ίσως το παιδί νιώθει ότι το συναίσθημά του δεν αναγνωρίστηκε.":"Ίσως το παιδί αισθάνεται ότι πρέπει να απολογηθεί.";text("Σκέψου την επικοινωνία",f+"\n\nΤι θα μπορούσες να δοκιμάσεις στην καθημερινότητά σου;");buttons(["Ολοκλήρωση","",""],finish);}
function finish(){stage="end";log("complete","yes");text("Ολοκλήρωση","Ευχαριστούμε για τη συμμετοχή. Εξήγαγε το CSV για να αποθηκεύσεις τις επιλογές.");buttons(["Εξαγωγή CSV","",""],download);}
function download(){let csv="event,value,age,elapsed\n"+events.map(e=>[e.event,e.value,e.age,e.elapsed].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="parent-perspective-demo.csv";a.click();URL.revokeObjectURL(a.href);}
AFRAME.registerComponent("gaze-choice",{schema:{index:{type:"int",default:0}},init(){this.el.addEventListener("click",()=>{if(this.el.getAttribute("visible")&&window.action){if(stage==="parent"||stage==="second")window.action(this.data.index);else if(this.data.index===0)window.action();}});this.el.addEventListener("mouseenter",()=>{this.el.setAttribute("material","color","#f2b84b;opacity:1;transparent:false;shader:flat");this.el.setAttribute("scale","1.035 1.12 1");const cursor=document.querySelector("#gazeCursor");if(cursor)cursor.setAttribute("material","color","#f2b84b");});this.el.addEventListener("mouseleave",()=>{this.el.setAttribute("material","color","#245b73;opacity:.78;transparent:true;shader:flat");this.el.setAttribute("scale","1 1 1");const cursor=document.querySelector("#gazeCursor");if(cursor)cursor.setAttribute("material","color","white");});}});

const sceneEl = document.querySelector("a-scene");
sceneEl.addEventListener("loaded", () => {
  bindLabelTexture("title", "cv-title");
  bindLabelTexture("message", "cv-message");
  bindLabelTexture("l0", "cv-l0");
  bindLabelTexture("l1", "cv-l1");
  bindLabelTexture("l2", "cv-l2");
  if (stage === "intro") intro();
});

function start(){age=$("age").value;started=performance.now();$("start").style.display="none";intro();}
$("start360").onclick=start;
$("startvr").onclick=async()=>{start();try{await document.querySelector("a-scene").enterVR();}catch(e){$("start").style.display="block";alert("Δεν ενεργοποιήθηκε WebXR VR. Δοκίμασε HTTPS σε Chrome Android. Μπορείς να δοκιμάσεις πρώτα τη λειτουργία 360°.");}};
</script></body></html>
